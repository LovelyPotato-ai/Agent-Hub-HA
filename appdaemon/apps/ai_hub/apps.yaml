---
# =============================================================================
# AppDaemon App Registration — AI Hub Orchestrator
# Deploy to: /config/appdaemon/apps/ai_hub/apps.yaml
#
# IMPORTANT: Replace ALL placeholder values (PASTE_... / REPLACE_...) with
# your real values before deploying. After the AI Hub is running you can
# update API keys via the Settings tab in the UI without editing this file.
# =============================================================================

ai_hub_orchestrator:
  module: main
  class: AIHubOrchestrator

  # ── Trigger / result HA entities ──────────────────────────────────────────
  trigger_event: "ai_hub_trigger"
  result_entity: "input_text.ai_hub_result"
  status_entity: "input_text.ai_hub_status"

  # ── LLM provider selection ────────────────────────────────────────────────
  # Supported providers:  openai | gemini | anthropic | openrouter
  # Example models:
  #   openai      → gpt-4o, gpt-4.1, gpt-4o-mini
  #   gemini      → gemini-2.5-pro, gemini-2.0-flash
  #   anthropic   → claude-sonnet-4-5, claude-opus-4
  #   openrouter  → any model slug from openrouter.ai/models
  active_llm_provider: "openai"
  active_llm_model: "gpt-4o"

  # ── LLM API keys ──────────────────────────────────────────────────────────
  # Only the key matching active_llm_provider is used at runtime.
  # Leave unused providers as placeholder strings.
  openai_api_key: "PASTE_YOUR_OPENAI_KEY_HERE"
  gemini_api_key: "PASTE_YOUR_GEMINI_KEY_HERE"
  anthropic_api_key: "PASTE_YOUR_ANTHROPIC_KEY_HERE"
  openrouter_api_key: "PASTE_YOUR_OPENROUTER_KEY_HERE"

  # ── GitHub integration ────────────────────────────────────────────────────
  # Leave as placeholder if you don't need GitHub commits yet.
  github_pat: "not_configured_yet"
  github_repo_owner: "not_configured_yet"
  github_repo_name: "not_configured_yet"
  github_branch: "main"

  # ── AppDaemon API password (used by the React frontend) ───────────────────
  # Must match the 'password' field in appdaemon.yaml → http section.
  appdaemon_api_password: "CHOOSE_A_STRONG_API_PASSWORD"

  # ── Logging ───────────────────────────────────────────────────────────────
  log: ai_hub_log
