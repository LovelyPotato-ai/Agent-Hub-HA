---
# =============================================================================
# AppDaemon Configuration — AI Hub
# Deploy to: /config/appdaemon/appdaemon.yaml on your HA Green device
# =============================================================================

appdaemon:
  # Thread pool size — allows concurrent crew executions without blocking the
  # AppDaemon event loop. Each crew.kickoff() runs in its own thread.
  threads: 10

  # Time zone must match your HA instance
  time_zone: Europe/Budapest

  # Latitude/longitude for sun-based calculations (optional but good practice)
  latitude: 47.4979
  longitude: 19.0402
  elevation: 102

  # Python packages installed at add-on startup via pip.
  # These are injected into the AppDaemon container's venv.
  python_packages: []
  # NOTE: Python packages are installed via init_commands below using pip
  # with --no-deps for crewai to avoid chromadb (which fails on ARM64/musl).
  # See init_commands section below.

  # HA plugin — connects AppDaemon to the HA event bus and state machine
  plugins:
    HASS:
      type: hass
      # Use your HA Green's IP address (not homeassistant.local — mDNS can fail inside the container)
      ha_url: http://192.168.1.14:8123
      # Paste your HA Long-Lived Access Token here directly.
      # Generate one at: HA Profile → Long-Lived Access Tokens → Create Token
      token: "PASTE_YOUR_HA_LONG_LIVED_TOKEN_HERE"
      # Retry connection on HA restart
      retry_secs: 5

# =============================================================================
# HTTP server — exposes the aiohttp REST API and serves the React frontend
# =============================================================================
http:
  url: http://0.0.0.0:5050
  # Password protecting the AppDaemon HTTP API (used by the React frontend).
  # Choose any strong string — this is NOT an HA token.
  password: "CHOOSE_A_STRONG_API_PASSWORD"
  # Allow the HA Ingress proxy to reach this server
  allow_ip:
    - 127.0.0.1
    - 172.30.32.0/23   # HA add-on internal network range

# =============================================================================
# Logging
# =============================================================================
logs:
  main_log:
    filename: /config/appdaemon/logs/appdaemon.log
    log_generations: 3
    log_size: 1000000
  error_log:
    filename: /config/appdaemon/logs/error.log
    log_generations: 3
    log_size: 500000
  ai_hub_log:
    name: ai_hub
    filename: /config/appdaemon/logs/ai_hub.log
    log_generations: 5
    log_size: 2000000
