---
# =============================================================================
# build.yaml — Multi-architecture build configuration
# =============================================================================
# HA builds the Docker image locally on the device using these base images.
# Using the official HA Python base images ensures pre-built wheels are
# available for ARM64/musl (aarch64) — avoiding Rust compilation failures.
# =============================================================================

build_from:
  aarch64: "ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.20"
  amd64:   "ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20"
  armv7:   "ghcr.io/home-assistant/armv7-base-python:3.12-alpine3.20"

squash: false
labels:
  org.opencontainers.image.title: "AI Hub"
  org.opencontainers.image.description: "Multi-agent AI orchestrator powered by CrewAI"
  org.opencontainers.image.source: "https://github.com/LovelyPotato-ai/Agent-Hub-HA"
  org.opencontainers.image.licenses: "MIT"
