# =============================================================================
# AppDaemon 4 Add-on Configuration
# =============================================================================
# Paste this into: Settings → Add-ons → AppDaemon 4 → Configuration tab
#
# Strategy: Install crewai-core (the actual agent runner) directly with
# pinned versions that match AppDaemon 4.5.13's constraints.
# This avoids chromadb (ARM64/musl build failure) and version conflicts.
# =============================================================================

log_level: info
system_packages:
  - git
python_packages: []
init_commands:
  # Pin pydantic to match AppDaemon 4.5.13 requirement (~=2.10.6)
  - "pip install 'pydantic==2.10.6'"
  # Pin aiohttp to match AppDaemon 4.5.13 requirement (<3.12.0)
  - "pip install 'aiohttp==3.11.18'"
  # Install crewai-core (the actual runtime, no chromadb dependency)
  - "pip install --no-deps crewai-core==1.15.16"
  # Install crewai-core's direct deps (excluding chromadb/lancedb)
  - "pip install 'opentelemetry-api==1.42.0' 'opentelemetry-sdk==1.42.0' 'opentelemetry-exporter-otlp-proto-http==1.42.0'"
  - "pip install 'litellm>=1.0.0' 'instructor>=1.0.0' 'click>=8.0.0' 'rich>=13.0.0'"
  - "pip install 'python-dotenv>=1.0.0' 'aiosqlite~=0.21.0' 'appdirs~=1.4.4'"
  - "pip install 'cel-python>=0.5.0,<0.6' 'json-repair~=0.60.1' 'json5~=0.10.0'"
  - "pip install 'jsonref~=1.1.0' 'mcp~=1.28.1' 'portalocker~=2.7.0' 'pyjwt>=2.13.0,<3'"
  - "pip install 'regex==2026.1.15' 'tomli~=2.0.2' 'tomli-w~=1.1.0' 'openpyxl~=3.1.5'"
  - "pip install 'aiofiles~=24.1.0' 'crewai-cli==1.15.16 --no-deps'"
  # LangChain provider wrappers
  - "pip install 'langchain-openai>=0.2.0' 'langchain-google-genai>=2.0.0' 'langchain-anthropic>=0.3.0' 'langchain-community>=0.3.0'"
  # Underlying LLM SDKs
  - "pip install 'openai>=1.50.0' 'google-generativeai>=0.8.0' 'anthropic>=0.40.0'"
  # GitHub integration
  - "pip install 'github3.py>=4.0.0'"
